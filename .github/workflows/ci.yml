name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: estagio
          POSTGRES_USER: estagio
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estagio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python tools/ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios
          path: reports/
